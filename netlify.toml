# IndiLingo production frontend deployment on Netlify.
# The API runs separately; set VITE_API_URL in the Netlify site environment.

[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm run build:netlify"
  publish = "apps/web/dist/public"

[build.environment]
  NODE_VERSION = "20"

# Vite SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';"

# Immutable caching for Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
