# IndiLingo production frontend deployment on Netlify.
# The API runs separately; set VITE_API_URL in the Netlify site environment.

[build]
  command = "pnpm install --frozen-lockfile && pnpm run build:netlify"
  publish = "apps/web/dist/public"

[build.environment]
  NODE_VERSION = "20"

# Vite SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable caching for Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
